name: Deploy CyberDocs to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with PDF files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify PDF files are hydrated
        shell: bash
        run: |
          test "$(find pdfs -type f \( -iname '*.pdf' \) | wc -l)" -eq 99
          if grep -RIlq "version https://git-lfs.github.com/spec/v1" pdfs; then
            echo "Git LFS pointers were not hydrated."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
